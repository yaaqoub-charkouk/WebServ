<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available CGI Scripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .scripts-list {
            display: grid;
            gap: 15px;
        }
        
        .script-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        .script-item:hover {
            background: #e8f0ff;
            transform: translateX(5px);
        }
        
        .script-icon {
            font-size: 2em;
            margin-right: 20px;
        }
        
        .script-info {
            flex: 1;
        }
        
        .script-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        
        .script-description {
            color: #666;
            font-size: 0.95em;
        }
        
        .script-link {
            display: inline-block;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
            margin-left: 20px;
        }
        
        .script-link:hover {
            background: #764ba2;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        
        .back-link:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CGI Scripts</h1>
        <p class="subtitle">Available server-side scripts to execute</p>
        
        <div class="scripts-list">
            <!-- hello.py script -->
            <div class="script-item">
                <div class="script-icon"></div>
                <div class="script-info">
                    <div class="script-name">hello.py</div>
                    <div class="script-description">A simple Python CGI script that demonstrates basic CGI execution</div>
                </div>
                <a href="/cgi/hello.py" class="script-link">Run Script</a>
            </div>
        </div>
        
        <a href="/" class="back-link">← Back Home</a>
    </div>
</body>
</html>
