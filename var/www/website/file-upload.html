<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Upload</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --ink: #2b2a26;
      --accent: #c86b2f;
      --paper: #fffaf0;
    }

    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(1100px circle at 10% 10%, #fef4df, var(--bg));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: min(720px, 100%);
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.15);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 0.5px;
    }

    p {
      margin: 0 0 20px;
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="file"] {
      padding: 10px;
      background: #fff;
      border: 2px solid var(--ink);
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 2px solid var(--ink);
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

  </style>
</head>
<body>
  <main class="card">
    <h1>Upload a file</h1>
    <p>Select a file and submit it to <strong>/uploads</strong>.</p>

    <form action="/uploads" method="post" enctype="multipart/form-data">
      <div class="field">
        <label for="file">Choose file</label>
        <input id="file" name="file" type="file" required>
      </div>
      <div class="actions">
        <button type="submit">Send File</button>
      </div>
    </form>
  </main>
</body>
</html>
