server {
	listen 4242;
	host 0.0.0.0;
	server_name localhost;

	root ./;
	index  index2.html;

	client_max_body_size 10M;

	error_page 400 var/www/website/400.html;
	error_page 403 var/www/website/403.html;
	error_page 404 var/www/website/404.html;
	error_page 500 var/www/website/500.html;
	error_page 502 var/www/website/502.html;
	error_page 503 var/www/website/503.html;

	location / {
		methods GET;
		autoindex off;
	}
	location /test_dir
	{
		methods POST GET;
		root ./test_dir;
		upload_store ./test_dir;
	}

	location /uploads {
		methods GET POST DELETE;
		root ./var/www/uploads;
		upload_store ./var/www/uploads;
		autoindex on;
	}

	location /cgi {
		methods GET POST;
		cgi_extension .py /usr/bin/python3;
		#cgi_extension .php /usr/bin/php-cgi;
		cgi_extension .sh /bin/bash;
		root ./var/www/cgi/cgi-bin;
	}

	location /redirect {
		return 301 http://localhost:8080/index.html;
	}
}

server {
	listen 8080;
	host 0.0.0.0;
	server_name webserv;

	root ./var/www/website;
	index yaaqoub.html;

	client_max_body_size 5M;

	error_page 403 /403.html;
	error_page 404 /404.html;
	error_page 500 /500.html;

	location / {
		methods GET;
		autoindex off;
	}

	location /uploads {
		methods GET POST DELETE;
		root ./var/www/uploads;
		upload_store ./var/www/uploads;
		autoindex on;
	}

	location /cgi {
		methods GET POST;
		cgi_extension .py /usr/bin/python3;
		root ./var/www/cgi/cgi-bin;
	}
}
